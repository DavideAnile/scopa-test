<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#1E5E3A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scopa" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background: #1e5e3a;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Schermata di caricamento: React la sostituisce appena l'app è pronta. */
      .loading {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: -apple-system, system-ui, sans-serif;
        color: #f3efe0;
      }
      .loading h1 {
        margin: 0;
        color: #f5c542;
        font-size: 48px;
        font-weight: 900;
      }
      .loading p {
        margin: 0;
        color: #b9cdbf;
        font-size: 16px;
      }
      .loading .dot {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 4px solid #ffffff30;
        border-top-color: #f5c542;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript> Per giocare serve JavaScript. </noscript>
    <div id="root">
      <div class="loading">
        <h1>Scopa</h1>
        <div class="dot"></div>
        <p>Caricamento…</p>
      </div>
    </div>
  </body>
</html>
